<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ik leg uit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap">
<style>
:root{--bg:#EEF2EC;--card:#fff;--ink:#2B3A39;--soft:#5d6f6d;--line:#d5ddd6;--blue:#7FA9BA;--green:#9DBF95;--sand:#E2C98F;--peach:#E0B09C;--rec:#C0654F;--ok:#4F8F62;--main:#4A7A88;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F2827;--card:#2A3534;--ink:#EAF0EC;--soft:#a9b9b5;--line:#3c4a48;--blue:#5E8798;--green:#6F9468;--sand:#a8924f;--peach:#a77a68;--main:#6FA3B2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1F2827;--card:#2A3534;--ink:#EAF0EC;--soft:#a9b9b5;--line:#3c4a48;--blue:#5E8798;--green:#6F9468;--sand:#a8924f;--peach:#a77a68;--main:#6FA3B2;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",system-ui,sans-serif;font-weight:600;font-size:20px}
main{max-width:640px;margin:0 auto;padding:16px 16px 40px;min-height:100vh}
h1{font-size:30px;margin:8px 0 16px;font-weight:800;text-align:center}
button{font:inherit;font-weight:800;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible{outline:4px solid var(--main);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:64px}
.back{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 20px;font-size:24px;color:var(--ink)}
.spk{background:var(--card);border:2px solid var(--line);border-radius:50%;width:56px;height:56px;font-size:26px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{border-radius:28px;padding:26px 8px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:24px;color:#1f2d2c;min-height:190px;justify-content:center;text-align:center}
.tile .ic{font-size:64px;line-height:1}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ph{padding:0;border-radius:22px;overflow:hidden;background:var(--card);border:3px solid var(--line);position:relative;aspect-ratio:3/4}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .ok{position:absolute;top:8px;right:8px;background:var(--ok);color:#fff;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;font-size:24px}
.big{width:100%;border-radius:28px;font-size:28px;padding:22px;display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px}
.photo-big{width:100%;max-height:48vh;object-fit:contain;border-radius:22px;background:var(--card);display:block;margin:0 auto}
.ask{text-align:center;font-size:28px;font-weight:800;margin:14px 0 4px}
.rec{background:var(--rec);color:#fff}
.stop{background:var(--ink);color:var(--bg)}
.send{background:var(--ok);color:#fff}
.alt{background:var(--card);border:3px solid var(--line);color:var(--ink)}
.timer{text-align:center;font-size:40px;font-weight:800;margin:10px 0}
.pulse{animation:p 1.2s infinite}
@keyframes p{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.done{text-align:center;padding:30px 0}.done .ic{font-size:110px}
.msg{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;text-align:center;font-size:18px;margin-top:12px}
input.name{width:100%;font:inherit;font-size:32px;padding:20px;border-radius:22px;border:3px solid var(--line);background:var(--card);color:var(--ink);text-align:center}
.t-link{display:block;margin:34px auto 0;background:none;color:var(--soft);font-size:16px;text-decoration:underline}
.rowc{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px;margin-bottom:12px;display:flex;gap:12px;align-items:center}
.rowc img{width:84px;height:110px;object-fit:cover;border-radius:12px;flex:none}
.rowc audio{width:100%;margin-top:6px}
.rowc small{color:var(--soft);font-size:15px;display:block}
.del{background:none;color:var(--rec);font-size:15px;text-decoration:underline;padding:4px 0}
.sc{display:flex;align-items:stretch;background:var(--card);border:3px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:12px;height:120px;position:relative;touch-action:pan-y}
.sc img{flex:1;min-width:0;object-fit:cover;pointer-events:none}
.sc .hd{width:84px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--bg);font-size:36px;touch-action:none;cursor:grab;user-select:none}
.sc .nr{font-size:32px;font-weight:800;background:var(--main);color:#fff;border-radius:50%;width:48px;height:48px;display:grid;place-items:center}
.sc.drag{z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.25);border-color:var(--main)}
.sc.bad{border-color:var(--rec)}
.hint{display:flex;gap:12px;align-items:center;background:var(--card);border:3px solid var(--sand);border-radius:22px;padding:12px;margin-top:12px;font-size:20px}
.hint img{width:90px;height:90px;object-fit:cover;border-radius:12px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.chip{background:var(--card);border:3px solid var(--line);border-radius:999px;padding:10px 20px;font-size:20px;color:var(--ink)}
.chip.on{background:var(--main);border-color:var(--main);color:#fff}
.say{background:var(--card);border:3px solid var(--ok);border-radius:24px;padding:18px;margin-top:14px;text-align:center}
.say .zin{font-size:28px;font-weight:800;line-height:1.3}
.say .lbl{font-size:18px;color:var(--soft);margin-bottom:6px}
.heard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;margin-top:12px;text-align:center;font-size:20px}
.res-ic{text-align:center;font-size:72px;margin-top:10px}
.res-t{text-align:center;font-size:26px;font-weight:800}
.fb{text-align:center;font-size:22px;margin-top:8px}
.spin{display:inline-block;animation:r 1.2s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style></head><body><main id="app"></main>

 {id:"keuken",t:"Keuken",ic:"🍽️",c:"var(--peach)",order:[16,3,14,15],h:{16:"Bekijk wat er allemaal in je kar moet liggen. Zit er genoeg van alles in? Kijk naar de houdbaarheidsdatum.",3:"Leg een dienplaat op de band. Lees wat je op het bord moet leggen. Leg alles op de juiste plaats.",14:"Er is een warme en een koude kant. Kijk goed.",15:"Steek de dienplaat op de juiste manier in de eetbak."}}];

const DESC={1:"Gang in het ziekenhuis met een bord met kamernummers 2.100-139, 2.140-149 en 2.150-189 en pijlen.",9:"Ticket van het ziekenhuis: afspraak 13:30, verdieping 2, route 2.B1, melden aan het secretariaat 2.B1.",10:"Wandbord op verdieping 2: blauw is consultatie (2.A+B+C links, 2.D+E+F rechts), oranje zijn de kamers 2.100 tot 2.699, met pijlen.",2:"Poetskar in de gang met gesloten deuren aan de kant van de gang, bij kamer 1.233.",4:"Veel poetskarren in het depot met blauwe en rode doekjes, bakjes en mops.",11:"Poetskar in de gang met blauwe en rode doekjes, spray, vuilzak en bakjes.",12:"Bovenkant van de poetskar met open bakje, plastic zakken en lijst.",13:"Deur van kamer 1.232 met affiche CONTACT: handen ontsmetten, handschoenen, schort, masker, beschermbril, deur dicht (kiemen).",5:"Inschrijvingshal met loketten 2 tot 5, schermen met nummers en een bank.",6:"Loket 6: interculturele bemiddelaar en tolk Arabisch en Maghrebijns.",7:"Affiche van de tolk Arabisch met telefoon en e-mail, gratis, maandag, woensdag en vrijdag.",8:"Loket 7: ombudsdienst voor klachten en rechten van de patiënt.",3:"Keukenruimte met maaltijdkarren met dienplateaus, borden, bestek, bakjes en kabels.",14:"Rij maaltijdkarren met een warme en een koude kant, aangesloten op stroom.",15:"Een dienplaat met een kap, een glas en een koekje wordt in de maaltijdkar geschoven.",16:"Aanvullijst van keukenkar 5.1.5A: ontbijt, beleg, dranken, brood, dessert en aantallen."};
const $=s=>document.querySelector(s);
const S={view:"home",theme:null,photo:null,seq:[],wrong:[],hint:null,step:0,rec:null,sec:0,txt:"",res:null,msg:""};
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="nl-BE";u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function go(v,x={}){Object.assign(S,x,{view:v});render()}
const q=t=>String(t).replace(/'/g,"’").replace(/"/g,"");
const spk=t=>`<button class="spk" aria-label="Luister" onclick="say('${q(t)}')">🔊</button>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
 const a=$("#app");let h="";
 if(S.view==="home"){
  h=`<div class="top"><span></span>${spk("Kies een thema")}</div><h1>Kies een thema</h1><div class="tiles">`+
  THEMES.map(t=>`<button class="tile" style="background:${t.c}" onclick="startTheme('${t.id}')"><span class="ic">${t.ic}</span>${t.t}</button>`).join("")+`</div>`;
 } else if(S.view==="theme"){
  const t=THEMES.find(x=>x.id===S.theme);
  h=`<div class="top"><button class="back" onclick="go('home')">⬅</button><span style="font-size:48px">${t.ic}</span>${spk("Sleep de foto's in de juiste volgorde.")}</div><h1>Zet de foto's in de juiste volgorde</h1><div id="seq">`+
  S.seq.map((n,i)=>`<div class="sc${S.wrong.includes(i)?' bad':''}" data-n="${n}"><div class="hd" aria-label="Sleep"><span class="nr">${i+1}</span>☰</div><img src="${IMG[n]}" alt=""></div>`).join("")+`</div>`+
  (S.hint!=null?`<div class="hint"><img src="${IMG[S.hint]}" alt=""><div>💡 ${t.h[S.hint]}</div>${spk(t.h[S.hint])}</div>`:"")+
  `<button class="big send" onclick="checkOrder()">✔ Klaar</button>`+
  (S.wrong.length?`<button class="big alt" onclick="giveHint()">💡 Hint</button>`:"");
  S._after=()=>initDrag();
 } else if(S.view==="photo"){
  h=`<div class="top"><button class="back" onclick="stopAll();go('home')">⬅</button><b>${S.step+1} / ${S.seq.length}</b>${spk("Zeg een zin bij de foto.")}</div>
  <img class="photo-big" src="${IMG[S.photo]}" alt="">`;
  if(S.rec==="rec") h+=`<div class="timer pulse">🔴 ${S.sec}s</div><button class="big stop" onclick="stopRec()">⏹ Klaar met praten</button>`;
  else if(S.rec==="think") h+=`<div class="res-ic"><span class="spin">⏳</span></div><div class="res-t">Ik luister…</div>`;
  else if(S.rec==="result"){
   const r=S.res,ok=r.niveau==="goed",mid=r.niveau==="bijna";
   h+=`<div class="res-ic">${ok?"🌟":mid?"👍":r.niveau==="geen"?"🔊":"🙂"}</div><div class="res-t">${ok?"Ik begrijp je!":mid?"Bijna goed!":r.niveau==="geen"?"Luister naar de zin":"Probeer nog eens"}</div>
   <div class="heard">👂 ${esc(S.txt)}</div>
   ${r.feedback?`<div class="fb">${esc(r.feedback)}</div>`:""}
   <div class="say"><div class="lbl">Zo kan je het zeggen:</div><div class="zin">${esc(r.juist)}</div><button class="big alt" style="margin-top:12px" onclick="say(S.res.juist)">🔊 Luister</button></div>
   <button class="big rec" onclick="go('photo',{rec:null,res:null,msg:''})">🔁 Zeg het nog eens</button>
   <button class="big send" onclick="nextStep()">➡ ${S.step+1<S.seq.length?'Volgende foto':'Klaar'}</button>`;
  } else h+=`<div class="ask">🗣️ Wat moet je doen?<br>Zeg een zin.</div><button class="big rec" onclick="startRec()">🎤 Spreek</button>`;
  if(S.msg)h+=`<div class="msg">${S.msg}</div>`;
 }
 a.innerHTML=h;if(S._after){const f=S._after;S._after=null;f()}
}
function startTheme(id){
 const t=THEMES.find(x=>x.id===id);let a=[...t.order];
 do{a.sort(()=>Math.random()-.5)}while(a.join()===t.order.join());
 say(t.t);go("theme",{theme:id,seq:a,wrong:[],hint:null,step:0});
}
function readOrder(){return [...document.querySelectorAll("#seq .sc")].map(e=>+e.dataset.n)}
function checkOrder(){
 const t=THEMES.find(x=>x.id===S.theme),cur=readOrder();
 const w=[];cur.forEach((n,i)=>{if(n!==t.order[i])w.push(i)});
 if(!w.length){say("Goed zo!");S.step=0;S.seq=t.order;return go("photo",{photo:t.order[0],sec:0,msg:"",rec:null,res:null,hint:null,wrong:[]})}
 S.seq=cur;S.wrong=w;S.hint=null;go("theme");say("Nog niet goed. Probeer opnieuw.");
}
function giveHint(){
 const t=THEMES.find(x=>x.id===S.theme),cur=readOrder();
 const i=cur.findIndex((n,k)=>n!==t.order[k]);if(i<0)return;
 S.seq=cur;S.hint=t.order[i];go("theme");say(t.h[S.hint]);
}
function nextStep(){
 if(S.step+1<S.seq.length){S.step++;go("photo",{photo:S.seq[S.step],sec:0,msg:"",rec:null,res:null})}
 else{say("Goed gedaan!");go("home")}
}
function initDrag(){
 const box=$("#seq");if(!box)return;let el=null,sy=0;
 box.querySelectorAll(".hd").forEach(h=>{
  h.addEventListener("pointerdown",e=>{el=h.parentElement;sy=e.clientY;h.setPointerCapture(e.pointerId);el.classList.add("drag");S.wrong=[];document.querySelectorAll(".sc.bad").forEach(x=>x.classList.remove("bad"))});
  h.addEventListener("pointermove",e=>{
   if(!el)return;
   el.style.transform=`translateY(${e.clientY-sy}px)`;
   for(const o of box.children){if(o===el)continue;const r=o.getBoundingClientRect();
    if(e.clientY>r.top&&e.clientY<r.bottom){
     const before=el.offsetTop,kids=[...box.children];
     if(kids.indexOf(o)>kids.indexOf(el))box.insertBefore(el,o.nextSibling);else box.insertBefore(el,o);
     sy+=el.offsetTop-before;el.style.transform=`translateY(${e.clientY-sy}px)`;
     [...box.children].forEach((c,i)=>c.querySelector(".nr").textContent=i+1);break}}
  });
  const end=()=>{if(!el)return;el.style.transform="";el.classList.remove("drag");el=null;S.seq=readOrder()};
  h.addEventListener("pointerup",end);h.addEventListener("pointercancel",end);
 });
}
/* ---- luisteren + beoordelen ---- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let sr,finals="",interim="",alts=[],tick,fin=false,errc="";
function stopAll(){fin=true;clearInterval(tick);try{sr&&sr.abort()}catch(e){}}
function startRec(){
 if(!SR){return go("photo",{rec:null,msg:"🎤 Deze browser kan niet luisteren. Open de app in Chrome (Android) of Safari (iPhone)."})}
 finals="";interim="";alts=[];fin=false;errc="";
 sr=new SR();sr.lang="nl-BE";sr.continuous=true;sr.interimResults=true;sr.maxAlternatives=3;
 sr.onresult=e=>{interim="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];
  if(r.isFinal){finals+=r[0].transcript+" ";const a=[];for(let k=1;k<r.length;k++)a.push(r[k].transcript);if(a.length)alts.push(a.join(" | "))}else interim+=r[0].transcript}};
 sr.onerror=e=>{errc=e.error};
 sr.onend=()=>{clearInterval(tick);if(!fin){fin=true;evaluate()}};
 try{sr.start()}catch(e){return go("photo",{rec:null,msg:"🎤 Het luisteren lukt niet. Probeer opnieuw."})}
 S.sec=0;S.msg="";go("photo",{rec:"rec"});
 tick=setInterval(()=>{S.sec++;const t=$(".timer");if(t)t.textContent="🔴 "+S.sec+"s";if(S.sec>=30)stopRec()},1000);
}
function stopRec(){clearInterval(tick);try{sr.stop()}catch(e){}}
function fallback(txt){return {niveau:"geen",gehoord:txt,juist:THEMES.find(x=>x.id===S.theme).h[S.photo],feedback:"Luister naar de voorbeeldzin en zeg hem na."}}
async function evaluate(){
 const txt=(finals+interim).trim();
 if(!txt){const m=(errc==="not-allowed"||errc==="service-not-allowed")?"🎤 Geef toestemming voor de microfoon.":"👂 Ik hoorde niets. Spreek luider en dichter bij de telefoon.";return go("photo",{rec:null,msg:m})}
 go("photo",{rec:"think",txt});
 const t=THEMES.find(x=>x.id===S.theme);
 const prompt=`Je beoordeelt een anderstalige cursist (Nederlands, niveau A1, kort geschoold, spreekt met een accent). De cursist moet bij een foto uitleggen wat je moet doen (een instructie geven).
Thema: ${t.t}.
De foto toont: ${DESC[S.photo]}
De bedoelde instructie bij deze foto: ${t.h[S.photo]}
De spraakherkenning schreef op: "${txt}"${alts.length?` (andere mogelijke herkenningen: ${alts.join(" ; ")})`:""}
Let op: de spraakherkenning maakt fouten door uitspraak en accent. Probeer te raden wat de cursist bedoelde, ook als woorden vervormd zijn of klinken als andere woorden.
Regels voor de beoordeling:
- Grammatica- en uitspraakfouten tellen NIET.
- Enige eis: zou een luisteraar begrijpen wat de cursist bedoelt, en past het bij de foto en een juiste instructie?
- "goed" = begrijpelijk en juist. "bijna" = deels begrijpelijk of belangrijk deel ontbreekt. "nogmaals" = niet te begrijpen of past niet bij de foto.
- De zin in "juist" moet een JUISTE, korte instructie zijn (maximaal 15 woorden, eenvoudig Nederlands in de je-vorm of gebiedende wijs, niveau A1) die bij de foto past. Gebruik zoveel mogelijk de woorden en het idee van de cursist. Hij mag afwijken van de bedoelde instructie als hij maar juist is.
- "feedback" = 1 of 2 heel korte, vriendelijke zinnen in eenvoudig Nederlands (A1). Zeg eerst wat goed was. Geef hoogstens één tip. Geen moeilijke woorden.
Antwoord ALLEEN met JSON: {"niveau":"goed"|"bijna"|"nogmaals","juist":"...","feedback":"..."}`;
 let res=null;
 try{const sm=await claude.use("sample");if(sm){res=await sm.json(prompt,{modelTier:"quick",cache:false})}}catch(e){}
 if(!res||!res.juist)res=fallback(txt);
 go("photo",{rec:"result",res,txt});
 setTimeout(()=>{if(S.rec==="result")say((res.feedback||"")+" "+res.juist)},400);
}
render();
</script></body></html>
